<svg
    width="64"
    height="64"
    viewBox="0 0 64 64"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
>
<!-- Background Circle (Optional, can be removed for transparent background) -->
<circle cx="32" cy="32" r="30" fill="#2D5A27" />

<!-- Golf Club Shaft -->

<rect
        x="42"
        y="10"
        width="3"
        height="40"
        rx="1.5"
        transform="rotate(20 42 10)"
        fill="#E5E7EB"
    />

<!-- Golf Club Head -->

<path
        d="M15 48C15 44 18 41 22 41H32C36 41 38 44 38 48V50C38 53 35 55 31 55H20C17 55 15 53 15 50V48Z"
        fill="#9CA3AF"
    />

<!-- Head Detail / Shine -->

<path d="M22 44H30" stroke="#F3F4F6" stroke-width="2" stroke-linecap="round" />

<!-- Small Golf Ball -->

<circle cx="12" cy="52" r="3" fill="white" />
</svg>
